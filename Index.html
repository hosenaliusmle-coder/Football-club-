<style>
:root{--y:#FFDF00;--g:#009C3B;--b:#002776;--bg:#f6f8f4;--card:#fff;--tx:#14213d;--mu:#55627a;--bd:#dfe6da;--nav:#002776;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1226;--card:#131d3b;--tx:#eef2ff;--mu:#a9b4d0;--bd:#24325c;--nav:#001a52}}
:root[data-theme="dark"]{--bg:#0b1226;--card:#131d3b;--tx:#eef2ff;--mu:#a9b4d0;--bd:#24325c;--nav:#001a52}
html{scroll-behavior:smooth;scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--nav);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--nav);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;gap:8px}
.logo{font-weight:700;font-size:1.15rem;color:var(--y);text-decoration:none;white-space:nowrap}
nav{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none}
nav a{color:#fff;text-decoration:none;font-size:.95rem;white-space:nowrap;opacity:.9}
nav a:hover{color:var(--y)}
#lang{background:var(--y);color:var(--b);border:0;border-radius:20px;padding:4px 12px;font:700 .85rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.hero{background:linear-gradient(135deg,var(--g),var(--b));color:#fff;text-align:center;padding:64px 20px 56px}
.hero .ball{font-size:3rem}
.hero h1{font-size:clamp(2rem,8vw,3.4rem);margin:.2em 0;color:var(--y);line-height:1.2}
.hero p{max-width:560px;margin:0 auto 22px;font-size:1.1rem}
.btn{display:inline-block;background:var(--y);color:var(--b);font-weight:700;border:0;border-radius:28px;padding:12px 26px;text-decoration:none;font:700 1rem "Hind Siliguri",sans-serif;cursor:pointer;margin:4px}
.btn.alt{background:transparent;color:#fff;border:2px solid #fff}
.btn.wa{background:#25D366;color:#fff}
section{max-width:960px;margin:0 auto;padding:44px 18px}
h2{color:var(--g);font-size:1.7rem;margin:0 0 6px;border-left:6px solid var(--y);padding-left:10px}
.sub{color:var(--mu);margin:0 0 20px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.card h3{margin:0 0 4px;color:var(--b)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .card h3{color:var(--y)}}
.num{display:inline-flex;width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;align-items:center;justify-content:center;font-weight:700;margin-bottom:6px}
.fee{background:var(--y);color:var(--b);border-radius:14px;padding:16px;font-weight:700;font-size:1.15rem;text-align:center;margin-bottom:16px}
form{display:grid;gap:10px}
label{font-weight:600;font-size:.92rem}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--bd);padding:8px 0}
.tag{font-size:.75rem;background:var(--g);color:#fff;border-radius:10px;padding:1px 8px}
.note{font-size:.85rem;color:var(--mu)}
footer{background:var(--nav);color:#fff;text-align:center;padding:26px 16px calc(26px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--y)}
</style>
</head>
<body>

tag:"A new football club in Kurigram. Play with passion, win together.",cta:"Join the Club",cta2:"View Fixtures",

msg:"I want to join the club.\nName: {n}\nAge: {a}\nPosition: {p}\nPhone: {f}\nPlease tell me how to pay the 100 taka fee."}

var PL=[["রাহিম","Rahim",10,"fw"],["করিম","Karim",8,"mf"],["সুমন","Suman",5,"df"],["জাহিদ","Jahid",1,"gk"]];
var FX=[["২০ নভেম্বর","20 Nov","বন্ধু একাদশ","Friends XI"],["২৭ নভেম্বর","27 Nov","গ্রাম একাদশ","Village XI"],["৪ ডিসেম্বর","4 Dec","শহর ক্লাব","Town Club"]];
var lang="bn";
try{lang=localStorage.getItem("lang")||"bn"}catch(e){}
function render(){
 var t=T[lang],i=lang==="bn"?0:1;
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(function(e){e.textContent=t[e.getAttribute("data-i")]});
 ["club","club2","club3"].forEach(function(id){document.getElementById(id).textContent=CLUB[lang]});
 document.getElementById("lang").textContent=lang==="bn"?"EN":"বাংলা";
 document.getElementById("players").innerHTML=PL.map(function(p){return '<div class="card"><div class="num">'+p[2]+'</div><h3>'+p[i]+'</h3><span class="tag">'+t[p[3]]+'</span></div>'}).join("");
 document.getElementById("fixtures").innerHTML=FX.map(function(f){return '<div class="row"><span>'+f[i]+'</span><b>'+CLUB[lang]+' vs '+f[2+i]+'</b><span class="tag">'+t.upc+'</span></div>'}).join("");
}
document.getElementById("lang").onclick=function(){lang=lang==="bn"?"en":"bn";try{localStorage.setItem("lang",lang)}catch(e){}render()};
document.getElementById("jf").onsubmit=function(e){
 e.preventDefault();
 var t=T[lang],pos=document.getElementById("ps");
 var m=t.msg.replace("{n}",document.getElementById("nm").value).replace("{a}",document.getElementById("ag").value).replace("{p}",pos.options[pos.selectedIndex].text).replace("{f}",document.getElementById("ph").value);
 window.open("https://wa.me/8801753378205?text="+encodeURIComponent(m),"_blank");
};
render();
